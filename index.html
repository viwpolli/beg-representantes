<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Beg Representantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<style>
/* Layout: sistema interno de fábrica — faixa escura com abas por papel, conteúdo em painéis, detalhe do pedido em gaveta lateral */
:root{
  --bg:#f3f3f9; --surface:#ffffff; --surface-2:#e9e8f4; --line:#d5d4e8;
  --ink:#18173b; --muted:#5c5b7a;
  --band:#1f1b5e; --band-ink:#eeedfb; --band-muted:#a9a6dc;
  --accent:#4b3fcf; --accent-ink:#ffffff; --accent-soft:#e4e1fa;
  --warn:#8f5200; --warn-soft:#fbe8cc; --ok:#1c6f36; --ok-soft:#d7efdd;
  --bad:#a8231b; --bad-soft:#f7dad7; --info:#284f97; --info-soft:#dce6f6;
  --scrim:rgba(14,12,40,.45);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100f1f; --surface:#19182e; --surface-2:#22213d; --line:#33314f;
  --ink:#e9e8f8; --muted:#a4a2c4;
  --band:#0b0a1a; --band-ink:#e9e8f8; --band-muted:#8f8cc4;
  --accent:#9d95ff; --accent-ink:#15123d; --accent-soft:#2b2763;
  --warn:#f0b35c; --warn-soft:#3a2a12; --ok:#6fd38c; --ok-soft:#163222;
  --bad:#f08a80; --bad-soft:#3d1a17; --info:#8fb2f0; --info-soft:#18263f;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#100f1f; --surface:#19182e; --surface-2:#22213d; --line:#33314f;
  --ink:#e9e8f8; --muted:#a4a2c4;
  --band:#0b0a1a; --band-ink:#e9e8f8; --band-muted:#8f8cc4;
  --accent:#9d95ff; --accent-ink:#15123d; --accent-soft:#2b2763;
  --warn:#f0b35c; --warn-soft:#3a2a12; --ok:#6fd38c; --ok-soft:#163222;
  --bad:#f08a80; --bad-soft:#3d1a17; --info:#8fb2f0; --info-soft:#18263f;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;}

body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.45rem} h3{font-size:1.08rem}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* top band */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-ink)}
.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:12px 0}
.brandrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.88rem;flex-wrap:wrap}
.role{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid var(--band-muted);color:var(--band-muted)}
.linkbtn{background:none;border:0;color:var(--band-ink);text-decoration:underline;cursor:pointer;font:inherit;padding:4px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--band-muted);font:600 .9rem var(--f-body);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{color:var(--band-ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--band-ink)}

main{padding-block:24px 48px}
.stack{display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--f-mono);font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 .9rem var(--f-body);padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 10px;font-size:.82rem}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.sw:focus-visible,.sizecard:focus-within,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:72px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
legend{font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:6px;padding:0}

.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);border-color:transparent}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sizecard{position:relative;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:var(--surface);text-align:center}
.sizecard input{position:absolute;opacity:0;pointer-events:none}
.sizecard:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.sizecard b{font-family:var(--f-display);font-size:1.05rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{padding:8px 12px;cursor:pointer;font-size:.88rem;font-weight:500;position:relative}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}

/* summary */
.sumline{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.sumline:last-child{border-bottom:0}
.total{font-family:var(--f-mono);font-size:1.6rem;font-variant-numeric:tabular-nums}
.note{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.88rem}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.mock{display:flex;justify-content:center;background:var(--surface-2);border-radius:10px;padding:14px}
.mock svg{width:100%;max-width:220px;height:auto}

/* chips & pills */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 11px;font:500 .82rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .num{opacity:.7;margin-left:4px}
.pill{display:inline-block;font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill[data-tone="warn"]{background:var(--warn-soft);color:var(--warn)}
.pill[data-tone="info"]{background:var(--info-soft);color:var(--info)}
.pill[data-tone="ok"]{background:var(--ok-soft);color:var(--ok)}
.pill[data-tone="bad"]{background:var(--bad-soft);color:var(--bad)}
.pill[data-tone="accent"]{background:var(--accent-soft);color:var(--accent)}
.tag{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}

/* order list */
.olist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ohead,.row{display:grid;grid-template-columns:70px minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.3fr) 110px 190px;gap:12px;padding:11px 16px;align-items:center}
.ohead{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);background:var(--surface-2)}
.row{border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit;width:100%}
.row:hover{background:var(--surface-2)}
.row .t{text-align:right}
.ohead .t{text-align:right}
.cut{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (max-width:760px){
  .ohead{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
  .row>:nth-child(1){grid-column:1/-1}
  .row>:nth-child(3),.row>:nth-child(4){grid-column:1}
  .row>:nth-child(5){grid-column:2;grid-row:2}
  .row>:nth-child(6){grid-column:2;grid-row:3/5;align-self:start}
  .row>:nth-child(2){grid-column:1;grid-row:2}
}

/* cards list */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ccard .top2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ficha{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:8px;padding:8px}
.ficha img{width:56px;height:34px;object-fit:contain;border-radius:4px;background:var(--surface)}

/* tables */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 14px;text-align:left;border-top:1px solid var(--line);font-size:.9rem}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--surface-2);min-width:80px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
table input{padding:6px 8px;font-size:.9rem;font-family:var(--f-mono);max-width:100px}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);z-index:41;overflow-y:auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.step{display:flex;flex-direction:column;gap:6px;font-size:.7rem;color:var(--muted);line-height:1.2}
.step i{height:5px;border-radius:3px;background:var(--line)}
.step.done i{background:var(--accent)}
.step.now i{background:var(--warn)}
.step.now{color:var(--ink);font-weight:600}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:520px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.mini{display:flex;gap:2px;margin-top:6px;max-width:160px}
.mini i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.mini i.d{background:var(--accent)} .mini i.n{background:var(--warn)}
.stcell{display:flex;flex-direction:column;align-items:flex-start}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.filters label.f{min-width:200px;flex:1;max-width:280px}
tr.tot td{font-weight:600;background:var(--surface-2)}
.hist{display:flex;flex-direction:column;gap:8px;font-size:.86rem;border-left:2px solid var(--line);padding-left:12px}
.hist time{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);display:block}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.copybox{font-size:.86rem;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:10px;white-space:pre-wrap}

/* login & portal */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:40px}
.loginbox{width:min(440px,100%);display:flex;flex-direction:column;gap:16px}
.demo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.demo button{text-align:left;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font:inherit;color:inherit}
.demo button:hover{background:var(--surface-2)}
.demo small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:.76rem}
.simbar{background:var(--warn-soft);color:var(--warn);font-size:.86rem}
.simbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;flex-wrap:wrap}
.portal{max-width:620px;margin:0 auto}
.foot{font-size:.8rem;color:var(--muted);padding-block:0 32px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:60;font-size:.9rem;max-width:calc(100% - 32px)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
(function(){
"use strict";
const COLORS = [
  ["Branco","#f3f3ef"],["Preto","#232323"],["Azul royal","#2b4fb6"],["Azul claro","#7fb5e4"],["Vermelho","#c3302c"],
  ["Vinho","#741f33"],["Rosa","#e57ab0"],["Pink","#d9248a"],["Lilás","#9a80cf"],["Verde bandeira","#1e8749"],
  ["Verde limão","#9cc93b"],["Amarelo","#f0c31d"],["Laranja","#ec7c22"],["Bege","#d8c6a2"],["Cinza","#9aa0a5"]
];
const colorHex = n => (COLORS.find(c=>c[0]===n)||COLORS[0])[1];
const FLOW = ["arte","sinal","producao","saldo","envio"];
const STEP_LABEL = ["Arte","Sinal 50%","Produção","Saldo + frete","Envio"];
const STATUS = {
  arte:["Aguardando arte","warn"],
  sinal:["Aguardando sinal","warn"],
  producao:["Em produção","accent"],
  saldo:["Aguardando saldo","warn"],
  envio:["Pronto para envio","info"],
  entregue:["Enviado","ok"],
  cancelado:["Cancelado","bad"]
};
const SIZE_INFO = {P:"Logo discreto, no centro", M:"Logo em destaque", G:"Arte na frente inteira"};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const digits = s => String(s||"").replace(/\D/g,"");
const brl = v => (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fmtDate = iso => new Date(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
const fmtDT = iso => new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const now = () => new Date().toISOString();
const uid = p => p + Math.random().toString(36).slice(2,8);
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200);}


function priceFor(st,modelId,size,qty,cores){
  const m = st.settings.models.find(x=>x.id===modelId);
  const tiers = [...st.settings.tiers].sort((a,b)=>b.min-a.min);
  const tier = tiers.find(t=>qty>=t.min) || tiers[tiers.length-1];
  const base = m ? m.prices[size] : 0;
  const unit = Math.round((base*tier.f + (Number(cores)===2 ? st.settings.twoColorAdd : 0))*100)/100;
  return {unit, total:Math.round(unit*qty*100)/100, tier, model:m};
}

/* ---------- conexão com o banco (preencha as duas linhas abaixo) ---------- */
const SUPABASE_URL = "https://nlmtyvrjpzxpghvcphsn.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sbXR5dnJqcHp4cGdodmNwaHNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4NTA4ODUsImV4cCI6MjExMDQyNjg4NX0.-BHmTXRb8jtEPxYHYkScr7SV76FsBMLGhcrE2ZyPvFY";
const LOGIN_DOMAIN = "acesso.Begsacolas.com.br"; // só para montar o login; nenhum e-mail é enviado

const configured = /^https:\/\/.+/.test(SUPABASE_URL) && SUPABASE_KEY.length > 40;
const libOk = !!(window.supabase && window.supabase.createClient);
const sb = configured && libOk ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const emailOf = login => `${login}@${LOGIN_DOMAIN}`;
const errMsg = e => (e && (e.message || e.error_description || e.msg)) || String(e || "erro desconhecido");

let S = {settings:null, users:[], clients:[], orders:[], fechamentos:{}};
let snap = {settings:"", users:{}, clients:{}, orders:{}, fech:{}};
let me = null, tab = null, portal = null, drawer = null, filter = "todos", draft = null, confirmKey = null, justCreated = null, cliDraft = null;
let boot = "loading", loginMsg = "", portalData = null, portalErr = "", busy = false;

function rowToUser(r){ return {id:r.id, login:r.login, nome:r.nome, role:r.role, regiao:r.regiao||"", ativo:r.ativo}; }
function rowToClient(r){ return Object.assign({ficha:null}, r.data||{}, {id:r.id, codigo:r.codigo, nome:r.nome, doc:r.doc, whats:r.whats, cidade:r.cidade, repId:r.rep_id, criadoEm:r.criado_em}); }
function clientToRow(c){ const data = Object.assign({}, c); ["id","codigo","nome","doc","whats","cidade","repId","criadoEm","criadoPor"].forEach(k=>delete data[k]);
  return {nome:c.nome, doc:c.doc, whats:c.whats, cidade:c.cidade||"", rep_id:c.repId||null, data}; }
function rowToOrder(r){ return Object.assign({hist:[], pagamentos:[]}, r.data||{}, {id:r.id, num:r.num, clientId:r.client_id, repId:r.rep_id, origem:r.origem, status:r.status, total:Number(r.total), compet:r.compet, comissaoPaga:r.comissao_paga, token:r.portal_token, criadoEm:r.criado_em}); }
function orderToRow(o){ const data = Object.assign({}, o); ["id","num","clientId","repId","origem","status","total","compet","comissaoPaga","token","criadoEm","criadoPor"].forEach(k=>delete data[k]);
  return {client_id:o.clientId, rep_id:o.repId||null, origem:o.origem, status:o.status, total:o.total, compet:o.compet, comissao_paga:!!o.comissaoPaga, data}; }
const mapJ = arr => Object.fromEntries(arr.map(x=>[x.id, JSON.stringify(x)]));
function makeSnap(){ return {settings:JSON.stringify(S.settings), users:mapJ(S.users), clients:mapJ(S.clients), orders:mapJ(S.orders),
  fech:Object.fromEntries(Object.entries(S.fechamentos).map(([k,v])=>[k, JSON.stringify(v)]))}; }

async function loadAll(){
  const [st, us, cl, or, fe] = await Promise.all([
    sb.from("settings").select("data").eq("id",1).single(),
    sb.from("profiles").select("*").order("nome"),
    sb.from("clients").select("*"),
    sb.from("orders").select("*").order("num"),
    sb.from("fechamentos").select("*")]);
  const bad = [st,us,cl,or,fe].find(r=>r.error); if (bad) throw bad.error;
  S.settings = st.data.data;
  S.users = us.data.map(rowToUser);
  S.clients = cl.data.map(rowToClient);
  S.orders = or.data.map(rowToOrder);
  S.fechamentos = Object.fromEntries(fe.data.map(r=>[r.mes, {fechadoEm:r.fechado_em, pagoEm:r.pago_em, por:r.por}]));
  if (me) me = S.users.find(u=>u.id===me.id) || me;
  snap = makeSnap();
}

let queue = Promise.resolve(), saveFailed = false;
function save(){
  queue = queue.then(persist).catch(async e=>{
    console.error(e); toast("Não foi possível salvar: " + errMsg(e) + ". Os dados foram recarregados.");
    try { await loadAll(); } catch(_) {} render();
  });
  return queue;
}
async function persist(){
  if (!me) return;
  const next = makeSnap(), jobs = [];
  const need = (q, what) => jobs.push(q.select("id").then(r=>{ if (r.error) throw r.error; if (!r.data || !r.data.length) throw new Error("sem permissão para alterar " + what); }));
  if (me.role==="empresa" && next.settings!==snap.settings) need(sb.from("settings").update({data:S.settings}).eq("id",1), "a configuração");
  if (me.role==="empresa") S.users.forEach(u=>{ if (snap.users[u.id] && snap.users[u.id]!==next.users[u.id]) need(sb.from("profiles").update({nome:u.nome, regiao:u.regiao, ativo:u.ativo}).eq("id",u.id), "o acesso"); });
  S.clients.forEach(c=>{ if (snap.clients[c.id] && snap.clients[c.id]!==next.clients[c.id]) need(sb.from("clients").update(clientToRow(c)).eq("id",c.id), "o cliente"); });
  S.orders.forEach(o=>{ if (snap.orders[o.id] && snap.orders[o.id]!==next.orders[o.id]) need(sb.from("orders").update(orderToRow(o)).eq("id",o.id), "o pedido"); });
  Object.entries(S.fechamentos).forEach(([mes,f])=>{ if (snap.fech[mes]!==next.fech[mes]) need(sb.from("fechamentos").upsert({mes, fechado_em:f.fechadoEm, pago_em:f.pagoEm}), "o fechamento"); });
  if (!jobs.length) return;
  await Promise.all(jobs);
  snap = next;
}
async function refresh(){
  if (!me) return;
  try { await queue; await loadAll(); } catch(e){ console.error(e); return; }
  const formTabs = ["novo","cadcliente","config","usuarios","senha"];
  if (!formTabs.includes(tab) && !document.querySelector(".drawer input:focus, .drawer textarea:focus, .drawer select:focus")) render();
}
setInterval(()=>{ if (me && document.visibilityState==="visible") refresh(); }, 45000);

async function afterAuth(){
  const { data:{ user:u } } = await sb.auth.getUser();
  if (!u) { me = null; return; }
  const { data:prof, error } = await sb.from("profiles").select("*").eq("id", u.id).maybeSingle();
  if (error) throw error;
  if (!prof) { await sb.auth.signOut(); throw new Error("Este login ainda não foi liberado pela fábrica."); }
  if (!prof.ativo) { await sb.auth.signOut(); throw new Error("Este acesso está bloqueado. Fale com a fábrica."); }
  me = rowToUser(prof); tab = null; filter = "todos";
  await loadAll();
}
async function loadPortal(token){
  const { data, error } = await sb.rpc("portal_get", { p_token: token });
  if (error || !data) { portalErr = "Este link de pedido não foi encontrado. Confira com o seu representante."; portalData = null; return; }
  portalErr = ""; portalData = data;
  S.settings = { models: data.models || [], freteGratisMin: Number(data.freteGratisMin)||0 };
}
async function start(){
  if (!sb) { boot = libOk ? "config" : "nolib"; render(); return; }
  const h = location.hash || "";
  if (h.indexOf("#p-")===0) { portal = h.slice(3); await loadPortal(portal); boot = "ready"; render(); return; }
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if (session) await afterAuth();
    else { const { data } = await sb.rpc("has_admin"); if (data===false) boot = "setup"; }
  } catch(e) { loginMsg = errMsg(e); me = null; }
  if (boot==="loading") boot = "ready";
  render();
}

/* ---------- bag mockup ---------- */
function lum(hex){const n=parseInt(hex.slice(1),16);const r=n>>16,g=n>>8&255,b=n&255;return (0.299*r+0.587*g+0.114*b)/255;}
function bagSVG(modelId,colorName,size,logoUrl,label){
  const m = model(modelId) || {kind:"ecobag"};
  const fill = colorHex(colorName), dark = lum(fill)<0.55, stroke = dark ? "rgba(255,255,255,.28)" : "rgba(0,0,0,.25)";
  const w = {P:52,M:88,G:132}[size]||88, h = w*0.62, cx=100, cy=140;
  let top = "";
  if (m.kind==="ecobag"||m.kind==="presente") top = `<path d="M62 62 C62 18 92 18 92 62 M108 62 C108 18 138 18 138 62" fill="none" stroke="${fill}" stroke-width="${m.kind==="presente"?5:9}" stroke-linecap="round"/><path d="M62 62 C62 18 92 18 92 62 M108 62 C108 18 138 18 138 62" fill="none" stroke="${stroke}" stroke-width="1"/>`;
  if (m.kind==="sacochila") top = `<path d="M28 66 L100 52 L172 66" fill="none" stroke="${stroke}" stroke-width="2"/><path d="M30 64 Q16 150 30 218 M170 64 Q184 150 170 218" fill="none" stroke="#e8e2d6" stroke-width="3"/>`;
  let body = `<rect x="26" y="60" width="148" height="160" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
  if (m.kind==="vazada") body = `<path d="M26 40 h148 v180 a5 5 0 0 1 -5 5 h-138 a5 5 0 0 1 -5 -5z" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/><rect x="78" y="54" width="44" height="14" rx="7" style="fill:var(--surface-2)" stroke="${stroke}"/>`;
  if (m.kind==="visor") body += `<rect x="40" y="190" width="120" height="20" rx="3" fill="rgba(255,255,255,.45)" stroke="${stroke}"/>`;
  const art = logoUrl
    ? `<image href="${logoUrl}" x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet"/>`
    : `<rect x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="4" fill="none" stroke="${dark?"#ffffff":"#111111"}" stroke-dasharray="4 3" opacity=".6"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="${size==="P"?8:11}" fill="${dark?"#ffffff":"#111111"}" opacity=".75">SUA LOGO</text>`;
  return `<svg viewBox="0 0 200 236" role="img" aria-label="${esc(label||"Simulação da sacola")}"><ellipse cx="100" cy="228" rx="78" ry="5" fill="rgba(0,0,0,.12)"/>${top}${body}${art}</svg>`;
}
function miniBag(size){
  const w={P:10,M:16,G:24}[size];
  return `<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="M14 14 C14 6 20 6 20 14 M24 14 C24 6 30 6 30 14" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="8" y="14" width="28" height="26" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="${22-w/2}" y="${27-w*0.31}" width="${w}" height="${w*0.62}" rx="1" fill="currentColor" opacity=".55"/></svg>`;
}

function readDraft(){
  const f = $("#orderForm"); if (!f) return;
  draft.clientId = f.clientId.value;
  draft.modelId = f.modelId.value;
  draft.size = f.querySelector("input[name=size]:checked")?.value || "M";
  draft.cores = Number(f.querySelector("input[name=cores]:checked")?.value || 1);
  draft.qty = Math.max(0, parseInt(f.qty.value,10) || 0);
}
function updateSummary(){
  if (!$("#orderForm") || !draft) return;
  readDraft();
  const d = draft, m = model(d.modelId);
  const c = client(d.clientId);
  const repId = c ? c.repId : null;
  const ficha = c?.ficha;
  const reuse = ficha && ficha.modelId===d.modelId && ficha.size===d.size;
  $("#mock").innerHTML = bagSVG(d.modelId,d.color,d.size,ficha?.logo,"Prévia da sacola");
  const p = priceFor(S,d.modelId,d.size,d.qty,d.cores);
  const repPct = S.settings.repPct, gPct = S.settings.gestorPct;
  const below = d.qty < m.min;
  const tiers = [...S.settings.tiers].sort((a,b)=>a.min-b.min);
  const next = tiers.find(t=>t.min>d.qty);
  let comLine = "";
  if (repId){
    if (me.role==="rep" && showCom()) comLine = `<div class="sumline"><span>Sua comissão (${repPct}%)</span><b class="num">${brl(p.total*repPct/100)}</b></div>`;
    else comLine = `<div class="sumline"><span>Comissão de ${esc(repName(repId))} (${repPct}%)</span><b class="num">${brl(p.total*repPct/100)}</b></div><div class="sumline"><span>Gestor da equipe (${gPct}%)</span><b class="num">${brl(p.total*gPct/100)}</b></div>`;
  }
  $("#summary").innerHTML = `
    <div class="sumline"><span>${esc(m.name)} · arte ${d.size} · ${d.cores} cor${d.cores>1?"es":""}</span></div>
    <div class="sumline"><span>Preço por unidade</span><b class="num">${brl(p.unit)}</b></div>
    <div class="sumline"><span>Faixa de quantidade</span><span class="small">${p.tier.f<1?`${p.tier.min}+ un (−${Math.round((1-p.tier.f)*100)}%)`:"Preço cheio"}</span></div>
    <div class="sumline" style="align-items:baseline"><span>Total do pedido</span><span class="total">${brl(p.total)}</span></div>
    <div class="sumline"><span>Frete</span><span class="small">${S.settings.freteGratisMin>0&&p.total>=S.settings.freteGratisMin?"Grátis":`Cobrado no saldo (grátis a partir de ${brl(S.settings.freteGratisMin)})`}</span></div>
    ${comLine}
    ${next&&!below?`<p class="small muted" style="margin-top:6px">A partir de ${next.min} un o preço cai ${Math.round((1-next.f)*100)}%.</p>`:""}`;
  const note = $("#clientNote");
  let msg = "", tone = "";
  if (below){ msg = `Este modelo tem pedido mínimo de ${m.min} unidades.`; tone="warn"; }
  else if (reuse){ msg = "Arte já aprovada na ficha deste cliente (mesmo modelo e tamanho). O pedido pula a etapa de arte e vai direto para o sinal."; tone="ok"; }
  else if (ficha){ msg = "O cliente já tem logo na ficha. Como o modelo ou o tamanho mudou, a fábrica confirma a arte com ele pelo WhatsApp."; tone="info"; }
  if (me.role==="empresa" && c && c.repId){ msg += (msg?" ":"") + `Cliente da carteira de ${repName(c.repId)}: a comissão vai para ele mesmo sendo pedido direto.`; tone = tone||"info"; }
  note.hidden = !msg; note.className = "note " + tone; note.textContent = msg;
  const cn = $("#colorName"); if (cn) cn.textContent = d.color;
}
async function submitOrder(){
  if (busy) return;
  readDraft();
  const d = draft, m = model(d.modelId), err = $("#formErr");
  const fail = t => { err.hidden=false; err.textContent=t; };
  err.hidden = true;
  const c = client(d.clientId);
  if (!c) return fail("Escolha o cliente do pedido.");
  if (d.qty < m.min) return fail(`Este modelo tem pedido mínimo de ${m.min} unidades.`);
  const p = priceFor(S,d.modelId,d.size,d.qty,d.cores);
  const reuse = c.ficha && c.ficha.modelId===d.modelId && c.ficha.size===d.size;
  const o = {clientId:c.id,repId:c.repId,origem:me.role==="rep"?"rep":"direto",criadoPor:me.id,
    modelId:d.modelId,color:d.color,size:d.size,cores:d.cores,qty:d.qty,unit:p.unit,total:p.total,
    repPct:S.settings.repPct,gestorPct:S.settings.gestorPct,
    status: reuse ? "sinal" : "arte", compet: competFor(now()), pagamentos:[],
    logo: c.ficha ? c.ficha.logo : null, logoNota:"", comissaoPaga:false,
    hist:[{t:now(),txt:me.role==="rep"?`Pedido enviado por ${me.nome}`:"Pedido lançado direto pela fábrica"}]};
  if (reuse) o.hist.push({t:now(),txt:"Arte reaproveitada da ficha do cliente (mesmo modelo e tamanho)"});
  else if (c.ficha) o.hist.push({t:now(),txt:"Logo da ficha reaproveitado; fábrica confirma a arte com o cliente"});
  busy = true; const btn = document.querySelector("#orderForm [type=submit]"); if (btn) { btn.disabled = true; btn.textContent = "Enviando…"; }
  try {
    await queue;
    const { data, error } = await sb.from("orders").insert(orderToRow(o)).select().single();
    if (error) throw error;
    const saved = rowToOrder(data);
    S.orders.push(saved); snap.orders[saved.id] = JSON.stringify(saved);
    draft = null; tab = "pedidos"; filter = "todos"; drawer = saved.id;
    toast(`Pedido #${saved.num} enviado à fábrica`);
    render();
  } catch(e) { fail("Não foi possível enviar o pedido: " + errMsg(e)); if (btn) { btn.disabled = false; btn.textContent = me.role==="empresa"?"Lançar pedido":"Enviar pedido à fábrica"; } }
  finally { busy = false; }
}

async function submitClient(f){
  if (busy) return;
  const err = $("#cliErr"), fail = t => { err.hidden=false; err.textContent=t; err.scrollIntoView({block:"center"}); };
  err.hidden = true;
  const v = {}; ["nome","razao","doc","segmento","responsavel","whats","email","instagram","cep","endereco","bairro","cidade","uf","repId","uso","volume","frequencia","obs"].forEach(k=>{ if (f[k]) v[k]=f[k].value.trim(); });
  cliDraft = v;
  const doc = digits(v.doc), wa = digits(v.whats);
  if (!v.nome) return fail("Informe o nome fantasia do cliente.");
  if (doc.length!==11 && doc.length!==14) return fail("O CNPJ precisa de 14 números (ou CPF com 11).");
  if (!v.responsavel) return fail("Informe quem é o responsável pela compra.");
  if (wa.length<10) return fail("Informe o WhatsApp com DDD. É por ele que a fábrica pede o logo.");
  if (!v.cidade) return fail("Informe a cidade.");
  busy = true; const btn = f.querySelector("[type=submit]"); btn.disabled = true; btn.textContent = "Salvando…";
  try {
    const { data:dup, error:e1 } = await sb.rpc("client_owner", { p_doc: doc, p_whats: wa });
    if (e1) throw e1;
    if (dup){
      if (me.role==="rep") return fail(dup.mine ? `Esse cliente já está na sua carteira (${dup.codigo}).` : "Esse CNPJ ou WhatsApp já está cadastrado na carteira de outro representante ou é atendido direto pela fábrica. Fale com o gestor.");
      return fail(`Já existe: ${dup.nome} (${dup.codigo}), carteira de ${dup.rep_nome || "Direto (sem representante)"}.`);
    }
    const repId = me.role==="rep" ? me.id : (v.repId||null);
    const extra = Object.assign({}, v); delete extra.repId;
    const c = Object.assign(extra, {doc, whats:wa, repId, ficha:null});
    const { data, error } = await sb.from("clients").insert(clientToRow(c)).select().single();
    if (error) throw error;
    const saved = rowToClient(data);
    S.clients.push(saved); snap.clients[saved.id] = JSON.stringify(saved);
    cliDraft = null; justCreated = null; tab = "clientes"; render(); window.scrollTo(0,0); toast(`${saved.nome} cadastrado (${saved.codigo})`);
  } catch(e) { fail("Não foi possível salvar: " + errMsg(e)); }
  finally { busy = false; if (btn.isConnected) { btn.disabled = false; btn.textContent = "Salvar cliente"; } }
}

/* ---------- months & closing ---------- */
let fMes = null, fRep = "todos";
const monthKey = iso => { const d = new Date(iso); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const curKey = () => monthKey(now());
const nextKey = k => { const [y,m] = k.split("-").map(Number); return m===12 ? `${y+1}-01` : `${y}-${String(m+1).padStart(2,"0")}`; };
const monthLabel = k => { const [y,m] = k.split("-").map(Number); const t = new Date(y,m-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); return t.charAt(0).toUpperCase()+t.slice(1); };
const dueDate = k => { const [y,m] = k.split("-").map(Number); return new Date(y, m, Math.min(28,S.settings.diaPag||10)).toLocaleDateString("pt-BR"); };
const orderCompet = o => o.compet || monthKey(o.criadoEm);
function competFor(iso){ let k = monthKey(iso); while (S.fechamentos[k]) k = nextKey(k); return k; }
const todayStr = () => { const t = new Date(); return new Date(t.getTime()-t.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
function monthStatus(k){
  const f = S.fechamentos[k];
  if (!f) return {txt: k===curKey() ? "Em aberto (mês em andamento)" : "Em aberto, aguardando fechamento", tone: k===curKey() ? "info" : "warn"};
  if (!f.pagoEm) return {txt:`Fechado · pagar até ${dueDate(k)}`, tone:"warn"};
  return {txt:`Comissões pagas em ${new Date(f.pagoEm).toLocaleDateString("pt-BR")}`, tone:"ok"};
}
function monthList(repId){
  const set = new Set([curKey()]);
  S.orders.forEach(o=>{ if (repId && o.repId!==repId) return; set.add(orderCompet(o)); });
  Object.keys(S.fechamentos).forEach(k=>set.add(k));
  return [...set].sort().reverse();
}
const monthOrders = (k, repId) => S.orders.filter(o=>o.status!=="cancelado" && o.repId && orderCompet(o)===k && (!repId || repId==="todos" || o.repId===repId)).sort((a,b)=>a.num-b.num);
const cRep = o => o.total*o.repPct/100, cGes = o => o.total*o.gestorPct/100;
const sumBy = (arr,f) => arr.reduce((a,x)=>a+f(x),0);
function monthSelect(ms){ return `<label class="f" for="fMes">Mês do fechamento<select id="fMes">${ms.map(k=>`<option value="${k}" ${k===fMes?"selected":""}>${monthLabel(k)}</option>`).join("")}</select></label>`; }

  }
  return `<div class="stack">

      <span class="pill" data-tone="${st.tone}" style="margin-bottom:8px">${st.txt}</span>
    </div>
    <div class="kpis">
      <div class="kpi"><span class="eyebrow">Pedidos do mês</span><b>${brl(base)}</b><span class="small muted">${os.length} pedido${os.length===1?"":"s"}</span></div>
      <div class="kpi"><span class="eyebrow">Comissão dos representantes</span><b>${brl(tRep)}</b></div>
      <div class="kpi"><span class="eyebrow">Parte do gestor</span><b>${brl(tGes)}</b></div>
      <div class="kpi"><span class="eyebrow">Total a pagar</span><b>${brl(tRep+tGes)}</b><span class="small muted">${f&&f.pagoEm?"Pago":"Pagar até "+dueDate(fMes)}</span></div>
    </div>
    ${action}
    <section class="stack" style="gap:8px"><h3>Por representante</h3>

/* ---------- rep commission ---------- */
let rPer = "mes", rFrom = "", rTo = "";
function repRange(){
  const t = new Date(), y = t.getFullYear(), m = t.getMonth();
  const end = new Date(y, m+1, 1);
  if (rPer==="2m") return [new Date(y, m-1, 1), end];
  if (rPer==="3m") return [new Date(y, m-2, 1), end];
  if (rPer==="custom"){
    const f = rFrom ? new Date(rFrom+"T00:00:00") : new Date(y, m, 1);
    const e = rTo ? new Date(rTo+"T00:00:00") : t; e.setDate(e.getDate()+1);
    return [f, e];
  }
  return [new Date(y, m, 1), end];
}
function viewComissao(){
  const [ini, fim] = repRange();
  const sc = showCom();
  const os = S.orders.filter(o=>o.repId===me.id && o.status!=="cancelado" && new Date(o.criadoEm)>=ini && new Date(o.criadoEm)<fim).sort((a,b)=>b.num-a.num);
  const vend = sumBy(os,o=>o.total);
  const byMonth = {}; os.forEach(o=>{ const k=orderCompet(o); (byMonth[k]=byMonth[k]||[]).push(o); });
  const months = Object.keys(byMonth).sort().reverse();
  const per = [["mes","Este mês"],["2m","Últimos 2 meses"],["3m","Últimos 3 meses"],["custom","Personalizado"]];
  const fmtD = d => d.toLocaleDateString("pt-BR");
  const lastDay = new Date(fim.getTime()-864e5);
  return `<div class="stack">

    <div class="chips" role="group" aria-label="Período">${per.map(([v,l])=>`<button class="chip" data-act="rper" data-v="${v}" aria-pressed="${rPer===v}">${l}</button>`).join("")}</div>
    ${rPer==="custom"?`<div class="filters"><label class="f" for="rFrom">De<input id="rFrom" type="date" value="${rFrom}"></label><label class="f" for="rTo">Até<input id="rTo" type="date" value="${rTo}" max="${todayStr()}"></label></div>`:""}
    <div class="kpis">
      <div class="kpi"><span class="eyebrow">Vendido no período</span><b>${brl(vend)}</b></div>

    ${months.length>1?`<section class="stack" style="gap:8px"><h3>Por mês</h3><div class="tbl"><table style="min-width:420px"><thead><tr><th>Mês</th><th class="n">Pedidos</th><th class="n">Vendido</th>${sc?`<th class="n">Comissão</th><th>Fechamento</th>`:""}</tr></thead><tbody>
      ${months.map(k=>{const mo=byMonth[k], st=monthStatus(k); return `<tr><td>${monthLabel(k)}</td><td class="n">${mo.length}</td><td class="n">${brl(sumBy(mo,o=>o.total))}</td>${sc?`<td class="n">${brl(sumBy(mo,cRep))}</td><td><span class="pill" data-tone="${st.tone}">${st.txt}</span></td>`:""}</tr>`;}).join("")}
    </tbody></table></div></section>`:""}
    <section class="stack" style="gap:8px"><h3>Pedidos do período</h3>
      <div class="tbl"><table><thead><tr><th>Pedido</th><th>Data</th><th>Cliente</th><th>Situação</th><th class="n">Valor</th>${sc?`<th class="n">Comissão</th>`:""}</tr></thead><tbody>
        ${os.map(o=>`<tr><td class="mono">#${o.num}${o.origem==="direto"?' <span class="tag">direto</span>':""}</td><td class="mono">${fmtDate(o.criadoEm)}</td><td>${esc(client(o.clientId)?.nome)}</td><td>${pill(o.status)}</td><td class="n">${brl(o.total)}</td>${sc?`<td class="n">${brl(cRep(o))}</td>`:""}</tr>`).join("")||`<tr><td colspan="${sc?6:5}" class="empty">Nenhum pedido neste período.</td></tr>`}

/* ---------- recebimentos (conciliação) ---------- */
const FORMAS = ["Pix","Boleto","Cartão","Transferência","Dinheiro"];
function newPay(tipo, valor, data){ const f = $("#payForma")?.value || "Pix"; return {id:uid("p"), tipo, valor, data, forma:f, conferido:false, conferidoEm:null}; }
const dayStr = iso => new Date(iso).toLocaleDateString("sv-SE");
let pPer = "hoje", pFrom = "", pTo = "", pConf = "todos";
function payRange(){
  const t = new Date(), d = n => new Date(t.getFullYear(), t.getMonth(), t.getDate()-n).toLocaleDateString("sv-SE");
  if (pPer==="ontem") return [d(1), d(1)];
  if (pPer==="7d") return [d(6), d(0)];
  if (pPer==="mes") return [new Date(t.getFullYear(), t.getMonth(), 1).toLocaleDateString("sv-SE"), d(0)];
  if (pPer==="custom") return [pFrom || d(0), pTo || d(0)];
  return [d(0), d(0)];
}
function allPays(){
  const out = [];
  S.orders.forEach(o=>(o.pagamentos||[]).forEach(x=>out.push({o, x})));
  return out.sort((a,b)=> a.x.data < b.x.data ? 1 : -1);
}
function viewRecebimentos(){
  const [ini, fim] = payRange();
  const inRange = allPays().filter(({x})=>{ const d = dayStr(x.data); return d>=ini && d<=fim; });
  const list = inRange.filter(({x})=> pConf==="todos" || (pConf==="sim" ? x.conferido : !x.conferido));
  const tot = sumBy(inRange,({x})=>x.valor), conf = sumBy(inRange.filter(({x})=>x.conferido),({x})=>x.valor);
  const pend = inRange.filter(({x})=>!x.conferido);
  const porForma = FORMAS.map(f=>{ const it = inRange.filter(({x})=>x.forma===f); return {f, n:it.length, v:sumBy(it,({x})=>x.valor), c:sumBy(it.filter(({x})=>x.conferido),({x})=>x.valor)}; }).filter(r=>r.n);
  const per = [["hoje","Hoje"],["ontem","Ontem"],["7d","Últimos 7 dias"],["mes","Este mês"],["custom","Personalizado"]];
  const fmtD = s2 => s2.split("-").reverse().join("/");
  const sinais = S.orders.filter(o=>o.status==="sinal"), saldos = S.orders.filter(o=>o.status==="saldo");
  const aRecSinal = sumBy(sinais,o=>o.total/2), aRecSaldo = sumBy(saldos,o=>Math.max(0,o.total-recebido(o)));
  const ck = "confall";
  return `<div class="stack">
    <div class="head"><div><p class="eyebrow">${ini===fim?fmtD(ini):fmtD(ini)+" a "+fmtD(fim)}</p><h2>Recebimentos</h2></div></div>
    <div class="chips" role="group" aria-label="Período">${per.map(([v,l])=>`<button class="chip" data-act="pper" data-v="${v}" aria-pressed="${pPer===v}">${l}</button>`).join("")}</div>
    ${pPer==="custom"?`<div class="filters"><label class="f" for="pFrom">De<input id="pFrom" type="date" value="${ini}" max="${todayStr()}"></label><label class="f" for="pTo">Até<input id="pTo" type="date" value="${fim}" max="${todayStr()}"></label></div>`:""}
    <div class="kpis">
      <div class="kpi"><span class="eyebrow">Entrou no período</span><b>${brl(tot)}</b><span class="small muted">${inRange.length} recebimento${inRange.length===1?"":"s"}</span></div>
      <div class="kpi"><span class="eyebrow">Conferido no banco</span><b>${brl(conf)}</b></div>
      <div class="kpi"><span class="eyebrow">Falta conferir</span><b>${brl(tot-conf)}</b><span class="small muted">${pend.length} lançamento${pend.length===1?"":"s"}</span></div>
    </div>
    ${porForma.length?`<div class="tbl"><table style="min-width:420px"><thead><tr><th>Forma</th><th class="n">Lançamentos</th><th class="n">Total</th><th class="n">Conferido</th><th class="n">Falta</th></tr></thead><tbody>
      ${porForma.map(r=>`<tr><td>${r.f}</td><td class="n">${r.n}</td><td class="n">${brl(r.v)}</td><td class="n">${brl(r.c)}</td><td class="n">${brl(r.v-r.c)}</td></tr>`).join("")}
    </tbody></table></div>`:""}
    <section class="stack" style="gap:8px">
      <div class="head"><h3>Lançamentos</h3>
        <div class="chips" role="group" aria-label="Conferência">${[["todos","Todos"],["nao","A conferir"],["sim","Conferidos"]].map(([v,l])=>`<button class="chip" data-act="pconf" data-v="${v}" aria-pressed="${pConf===v}">${l}</button>`).join("")}</div></div>
      <p class="small muted">Abra o extrato do banco do mesmo período e marque cada valor que encontrar lá.</p>
      <div class="tbl"><table><thead><tr><th>Data</th><th>Pedido</th><th>Cliente</th><th>Tipo</th><th>Forma</th><th class="n">Valor</th><th>Banco</th></tr></thead><tbody>
        ${list.map(({o,x})=>`<tr><td class="mono">${fmtDate(x.data)}</td><td><button class="linkbtn mono" style="color:var(--accent);padding:0" data-act="open" data-id="${o.id}">#${o.num}</button></td><td>${esc(client(o.clientId)?.nome)}</td><td>${esc(x.tipo)}</td><td>${esc(x.forma)}</td><td class="n">${brl(x.valor)}</td>
          <td>${x.conferido?`<button class="btn small" data-act="conf" data-o="${o.id}" data-p="${x.id}" title="Desfazer">Conferido ✓</button>`:`<button class="btn small primary" data-act="conf" data-o="${o.id}" data-p="${x.id}">Conferir</button>`}</td></tr>`).join("")||`<tr><td colspan="7" class="empty">Nenhum recebimento ${pConf==="nao"?"a conferir ":pConf==="sim"?"conferido ":""}neste período.</td></tr>`}
      </tbody></table></div>
      ${pend.length>1?`<div><button class="btn small" data-act="confall">${confirmKey===ck?`Clique de novo para marcar os ${pend.length} como conferidos`:"Marcar todos do período como conferidos"}</button></div>`:""}
    </section>
    <section class="stack" style="gap:8px"><h3>Ainda a receber dos clientes</h3>
      <div class="kpis">
        <div class="kpi"><span class="eyebrow">Sinais pendentes</span><b>${brl(aRecSinal)}</b><span class="small muted">${sinais.length} pedido${sinais.length===1?"":"s"} com arte aprovada</span></div>
        <div class="kpi"><span class="eyebrow">Saldos pendentes</span><b>${brl(aRecSaldo)}</b><span class="small muted">${saldos.length} pedido${saldos.length===1?"":"s"} produzido${saldos.length===1?"":"s"} + frete</span></div>
      </div>
      ${sinais.length+saldos.length?`<div class="tbl"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Falta</th><th class="n">Valor</th></tr></thead><tbody>
        ${[...sinais,...saldos].map(o=>`<tr><td><button class="linkbtn mono" style="color:var(--accent);padding:0" data-act="open" data-id="${o.id}">#${o.num}</button></td><td>${esc(client(o.clientId)?.nome)}</td><td>${o.status==="sinal"?"Sinal 50%":"Saldo 50%"+(freteGratis(o)?"":" + frete")}</td><td class="n">${brl(o.status==="sinal"?o.total/2:Math.max(0,o.total-recebido(o)))}</td></tr>`).join("")}
      </tbody></table></div>`:""}
    </section>
  </div>`;
}

          ${["P","M","G"].map(s=>`<td class="n"><input aria-label="${esc(m.name)} arte ${s}" name="p-${m.id}-${s}" type="number" step="0.01" min="0" value="${m.prices[s].toFixed(2)}"></td>`).join("")}</tr>`).join("")}
      </tbody></table></div></section>
    <section class="stack" style="gap:8px"><h3>Desconto por quantidade</h3>
      <div class="tbl"><table style="min-width:360px"><thead><tr><th>A partir de</th><th class="n">Desconto (%)</th></tr></thead><tbody>
        ${st.tiers.map((t,i)=>`<tr><td class="mono">${t.min.toLocaleString("pt-BR")} un</td><td class="n"><input aria-label="Desconto a partir de ${t.min}" name="tier-${i}" type="number" step="1" min="0" max="60" value="${Math.round((1-t.f)*100)}"></td></tr>`).join("")}
      </tbody></table></div></section>
  </form>`;
}

/* ---------- drawer ---------- */

  const idx = FLOW.indexOf(o.status);
  const isEmp = me.role==="empresa";

  const rec = recebido(o), falta = Math.max(0, o.total-rec);

  }
  const clientLink = o.status==="arte" && me.role!=="gestor" ? `
    <section class="panel stack"><h3>Avisar o cliente</h3>
      <p class="small muted">O botão abre o WhatsApp com o número de ${esc(c?.responsavel||c?.nome)} e a mensagem prontos. É só apertar enviar.${me.role==="rep"&&!fabWa?" Peça à fábrica para cadastrar o WhatsApp dela, assim o cliente manda o logo direto para lá.":""}</p>
      <div class="copybox" id="msgText">${esc(msg)}</div>
      <div class="btnrow"><a class="btn primary" href="${waHref}" target="_blank" rel="noopener">Enviar pelo WhatsApp</a><button class="btn small" data-act="copy">Copiar mensagem</button><a class="btn small" href="${portalUrl(o)}" target="_blank" rel="noopener">Abrir link do cliente</a></div>
      <p class="small muted">Enviando para <span class="mono">${esc(c?.whats)}</span>. Se o WhatsApp não abrir, use Copiar mensagem.</p>
    </section>` : "";
  $("#layer").innerHTML = `<div class="scrim" data-act="close"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Pedido ${o.num}">
    <div class="dhead"><div><p class="eyebrow">Pedido <span class="mono">#${o.num}</span> · ${fmtDate(o.criadoEm)}${o.origem==="direto"?' · <span class="tag">direto</span>':""}</p><h2>${esc(c?.nome)}</h2></div>
      <button class="btn small" data-act="close" aria-label="Fechar">Fechar</button></div>
    <div>${pill(o.status)}</div>
    ${o.status!=="cancelado"?`<div class="steps" style="grid-template-columns:repeat(5,minmax(0,1fr))">${steps}</div>`:""}
    <div class="dgrid">
      <div class="mock">${bagSVG(o.modelId,o.color,o.size,o.logo,"Simulação do pedido "+o.num)}</div>
      <dl class="kv">
        <dt>Modelo</dt><dd>${esc(m?.name)}</dd><dt>TNT</dt><dd>${esc(o.color)}</dd>
        <dt>Arte</dt><dd>${o.size} · ${o.cores} cor${o.cores>1?"es":""}</dd><dt>Quantidade</dt><dd class="num">${o.qty.toLocaleString("pt-BR")} un</dd>
        <dt>Unitário</dt><dd class="num">${brl(o.unit)}</dd><dt>Total</dt><dd class="num"><b>${brl(o.total)}</b></dd>
        ${me.role!=="rep"?`<dt>Carteira</dt><dd>${esc(repName(o.repId))}</dd>`:""}
        <dt>Cidade</dt><dd>${esc(c?.cidade)}</dd>
      </dl>
    </div>
    ${actions}

    <section class="stack" style="gap:8px"><h3>Histórico</h3><div class="hist">${o.hist.slice().reverse().map(h=>`<div><time>${fmtDT(h.t)}</time>${esc(h.txt)}</div>`).join("")}</div></section>
  </aside>`;
  const fi = $("#empLogo"); if (fi) fi.addEventListener("change", e=>readLogo(e.target.files[0], url=>{ o.logo=url; log(o,"Fábrica anexou o logo do cliente"); save(); render(); toast("Logo guardado"); }));

const portalUrl = o => location.origin + location.pathname + "#p-" + o.token;
function viewPortal(){
  const head = `<div class="brand" style="font-size:1.2rem">${brandMark()}<span>Beg Sacolas</span></div>`;
  if (!portalData) return `<main class="wrap"><div class="portal stack">${head}<p class="note bad">${esc(portalErr || "Carregando…")}</p></div></main>`;
  const p = portalData.pedido || {}, o = Object.assign({}, p, {status:portalData.status, total:Number(portalData.total), num:portalData.num});
  const m = model(o.modelId) || {name:"Sacola"}, rec = Number(portalData.recebido)||0;
  const fg = (Number(portalData.freteGratisMin)||0) > 0 && o.total >= Number(portalData.freteGratisMin);
  let body = "";
  if (o.status==="arte") body = `<section class="panel stack">
      <h3>${o.logo?"Logo recebido":"Envie o logo da sua empresa"}</h3>
      <p class="muted">Pode ser foto, PNG, JPG ou print. Se preferir, mande pelo WhatsApp.</p>
      <label class="f" for="cliLogo">${o.logo?"Trocar o arquivo":"Escolher arquivo"}<input type="file" accept="image/*" id="cliLogo"></label>
      ${o.logo?`<p class="muted">Confira a prévia acima. Se estiver tudo certo, aprove para seguir.</p><div><button class="btn primary" data-act="papprove">Aprovar arte</button></div>`:""}
    </section>`;
  else if (o.status==="sinal") body = `<section class="panel"><p class="note ok">Arte aprovada. Para iniciar a produção, falta o sinal de ${brl(o.total/2)}.</p></section>`;
  else if (o.status==="producao") body = `<section class="panel"><p class="note ok">Sinal recebido. Sua sacola está em produção.</p></section>`;
  else if (o.status==="saldo") body = `<section class="panel"><p class="note info">Produção pronta. Para enviar, falta o saldo de ${brl(Math.max(0,o.total-rec))}${fg?" (frete grátis)":" mais o frete, que a fábrica vai informar"}.</p></section>`;
  else if (o.status==="envio") body = `<section class="panel"><p class="note ok">Pedido pago e pronto. Será enviado em breve.</p></section>`;
  else if (o.status==="entregue") body = `<section class="panel"><p class="note ok">Pedido enviado. Para repetir, é só chamar seu representante: sua arte fica guardada.</p></section>`;
  else body = `<section class="panel"><p class="note bad">Este pedido foi cancelado.</p></section>`;
  const idx = FLOW.indexOf(o.status);
  const steps = o.status==="cancelado" ? "" : `<div class="steps" style="grid-template-columns:repeat(5,minmax(0,1fr))">${FLOW.map((s2,i)=>`<div class="step ${i<idx||o.status==="entregue"?"done":(i===idx?"now":"")}"><i></i>${STEP_LABEL[i]}</div>`).join("")}</div>`;

function readLogo(file, cb){
  if (!file) return;
  if (!/^image\//.test(file.type)) { toast("Escolha um arquivo de imagem (PNG, JPG ou SVG)."); return; }
  const fr = new FileReader();
  fr.onload = () => {
    const url = fr.result;
    const img = new Image();
    img.onload = () => {
      const W = img.width || 600, H = img.height || 600, max = 600, r = Math.min(1, max/Math.max(W,H));
      const cv = document.createElement("canvas"); cv.width = Math.round(W*r); cv.height = Math.round(H*r);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      cb(cv.toDataURL("image/png"));
    };
    img.onerror = () => toast("Não deu para abrir essa imagem. Tente outro arquivo.");
    img.src = url;
  };
  fr.readAsDataURL(file);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, o = drawer ? order(drawer) : (portal ? order(portal) : null);
  const keepConfirm = ["confall","cancel","closemonth","paymonth"].includes(act);
  if (!keepConfirm) confirmKey = null;
  switch(act){
    case "logout": (async()=>{ try { await queue; await sb.auth.signOut(); } catch(_){} me=null; tab=null; drawer=null; draft=null; loginMsg=""; S = {settings:null, users:[], clients:[], orders:[], fechamentos:{}}; render(); })(); break;
    case "tab": tab = el.dataset.v; drawer=null; if (tab!=="novo") draft=null; render(); window.scrollTo(0,0); refresh(); break;
    case "filter": filter = el.dataset.v; render(); break;
    case "pper": pPer = el.dataset.v; if (pPer==="custom" && !pFrom){ pFrom = todayStr(); pTo = todayStr(); } render(); break;
    case "pconf": pConf = el.dataset.v; render(); break;
    case "conf": { const oo = order(el.dataset.o), x = oo.pagamentos.find(y=>y.id===el.dataset.p); x.conferido = !x.conferido; x.conferidoEm = x.conferido ? now() : null;
      log(oo, `${x.tipo} de ${brl(x.valor)} ${x.conferido?"conferido no banco":"marcado como não conferido"}`); save(); render(); break; }
    case "confall": if (confirmKey==="confall"){ confirmKey=null; const [i2,f2] = payRange(); allPays().forEach(({o:oo,x})=>{ const d=dayStr(x.data); if(d>=i2&&d<=f2&&!x.conferido){ x.conferido=true; x.conferidoEm=now(); log(oo,`${x.tipo} de ${brl(x.valor)} conferido no banco`);} }); save(); toast("Recebimentos marcados como conferidos"); } else confirmKey="confall"; render(); break;
    case "rper": rPer = el.dataset.v; if (rPer==="custom" && !rFrom){ const t=new Date(); rFrom = new Date(t.getFullYear(),t.getMonth(),1).toLocaleDateString("sv-SE"); rTo = todayStr(); } render(); break;
    case "open": drawer = el.dataset.id; renderLayer(); setTimeout(()=>$(".drawer [data-act=close].btn")?.focus(),0); break;
    case "close": drawer = null; renderLayer(); break;
    case "color": if (draft){ draft.color = el.dataset.v; document.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed", b===el)); updateSummary(); } break;
    case "newclient": justCreated = null; cliDraft = null; tab="cadcliente"; drawer=null; render(); window.scrollTo(0,0); break;
    case "orderfornew": draft = freshDraft(); draft.clientId = justCreated; justCreated = null; tab="novo"; render(); window.scrollTo(0,0); break;
    case "skiporder": justCreated = null; tab="clientes"; render(); break;
    case "anotherclient": justCreated = null; cliDraft = null; render(); break;
    case "neworderfor": draft = freshDraft(); draft.clientId = el.dataset.id; tab="novo"; render(); break;
    case "repeat": {
      const last = S.orders.filter(x=>x.clientId===el.dataset.id && x.status!=="cancelado").sort((a,b)=>b.num-a.num)[0];
      draft = freshDraft(); draft.clientId = el.dataset.id;
      if (last) Object.assign(draft,{modelId:last.modelId,color:last.color,size:last.size,cores:last.cores,qty:last.qty});
      tab="novo"; render(); toast("Último pedido copiado. Ajuste a quantidade se precisar."); break; }
    case "approveart": { o.status="sinal"; log(o, portal ? "Cliente aprovou a arte pelo sistema" : "Arte aprovada pelo cliente (confirmado pela fábrica)");
      const c = client(o.clientId); c.ficha = {logo:o.logo,modelId:o.modelId,color:o.color,size:o.size,cores:o.cores,em:now()};
      log(o,"Arte guardada na ficha do cliente para os próximos pedidos"); save(); render(); window.scrollTo(0,0); break; }
    case "paysinal": case "payfull": { const dv = $("#payDate")?.value; const dt = dv ? new Date(dv+"T12:00:00").toISOString() : now();
      const full = act==="payfull", v = Math.round((full ? o.total-recebido(o) : o.total/2)*100)/100;
      o.pagamentos.push(newPay(full?"Pagamento total":"Sinal 50%", v, dt)); o.status="producao";
      log(o, `${full?"Pagamento total":"Sinal"} recebido: ${brl(v)} (${fmtDate(dt)}). Pedido em produção`); save(); render(); break; }
    case "prodok": { const ok = recebido(o) >= o.total - 0.01 && freteGratis(o); o.status = ok ? "envio" : "saldo";
      log(o, ok ? "Produção concluída. Pedido pronto para envio" : "Produção concluída. Aguardando saldo e frete para enviar"); save(); render(); break; }
    case "paysaldo": { const dv = $("#payDate")?.value; const dt = dv ? new Date(dv+"T12:00:00").toISOString() : now();
      let fr = 0;
      if (!freteGratis(o)){ const raw = $("#freteVal")?.value; fr = parseFloat(raw);
        if (raw==="" || !isFinite(fr) || fr<0){ const e2=$("#saldoErr"); e2.hidden=false; e2.textContent="Informe o valor do frete (use 0 se o cliente vai retirar)."; break; } }
      const v = Math.round((o.total-recebido(o))*100)/100;
      if (v>0) o.pagamentos.push(newPay("Saldo 50%", v, dt));
      o.frete = freteGratis(o) ? 0 : fr; if (o.frete>0) o.pagamentos.push(newPay("Frete", o.frete, dt));
      o.status="envio";
      log(o, `Recebido: saldo ${brl(v)} + frete ${freteGratis(o)?"grátis":brl(o.frete)} (${fmtDate(dt)}). Pronto para envio`); save(); render(); break; }
    case "shipped": o.status="entregue"; log(o,"Pedido enviado"); save(); render(); break;
    case "closemonth": { const ck="close-"+fMes; if (confirmKey===ck){ confirmKey=null; S.fechamentos[fMes]={fechadoEm:now(),pagoEm:null,por:me.id}; save(); toast(`${monthLabel(fMes)} fechado`); } else confirmKey=ck; render(); break; }
    case "paymonth": { const ck="pay-"+fMes; if (confirmKey===ck){ confirmKey=null; S.fechamentos[fMes].pagoEm=now(); monthOrders(fMes,"todos").forEach(x=>{ x.comissaoPaga=true; log(x,`Comissão paga no fechamento de ${monthLabel(fMes)}`); }); save(); toast("Comissões registradas como pagas"); } else confirmKey=ck; render(); break; }
    case "cancel": if (confirmKey==="cancel-"+o.id){ confirmKey=null; o.status="cancelado"; log(o,"Pedido cancelado pela fábrica"); save(); } else confirmKey="cancel-"+o.id; render(); break;
    case "copy": { const t = $("#msgText").textContent;
      const done = () => toast("Mensagem copiada");
      try { navigator.clipboard.writeText(t).then(done, ()=>selectText()); } catch(_) { selectText(); } break; }
    case "papprove": (async()=>{ el.disabled = true; const { error } = await sb.rpc("portal_approve", { p_token: portal }); if (error) toast(errMsg(error)); else toast("Arte aprovada. Obrigado!"); await loadPortal(portal); render(); window.scrollTo(0,0); })(); break;
    case "toggleuser": { const u = user(el.dataset.id); u.ativo=!u.ativo; save(); render(); toast(u.ativo?"Acesso reativado":"Acesso bloqueado"); break; }
  }
});
function selectText(){ const r=document.createRange(); r.selectNodeContents($("#msgText")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texto selecionado: use Copiar do seu aparelho"); }

document.addEventListener("input", e => {
  if (e.target.closest("#orderForm")) updateSummary();
  if (e.target.id==="freteVal" && drawer){ const o = order(drawer); const f = parseFloat(e.target.value)||0; $("#saldoTot").textContent = brl(Math.max(0,o.total-recebido(o)) + f); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.closest("#orderForm")) updateSummary();
  if (t.id==="fMes"){ fMes = t.value; confirmKey = null; render(); return; }
  if (t.id==="fRep"){ fRep = t.value; render(); return; }
  if (t.id==="rFrom"){ rFrom = t.value; render(); return; }
  if (t.id==="rTo"){ rTo = t.value; render(); return; }
  if (t.id==="pFrom"){ pFrom = t.value; render(); return; }
  if (t.id==="pTo"){ pTo = t.value; render(); return; }
  if (t.dataset.act==="assign"){ const c = client(t.dataset.id); c.repId = t.value || null; save(); toast(`Carteira de ${c.nome}: ${repName(c.repId)}. Vale para os próximos pedidos.`); }
  if (t.id==="cliLogo"){ readLogo(t.files[0], async url=>{ toast("Enviando…"); const { error } = await sb.rpc("portal_set_logo", { p_token: portal, p_logo: url }); if (error) toast(errMsg(error)); else toast("Logo enviado"); await loadPortal(portal); render(); }); }
});
document.addEventListener("keydown", e => { if (e.key==="Escape" && drawer){ drawer=null; renderLayer(); } });
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id==="loginForm"){
    (async()=>{
      const err = $("#loginErr"), btn = f.querySelector("[type=submit]");
      const login = f.lg.value.trim().toLowerCase();
      btn.disabled = true; btn.textContent = "Entrando…"; err.hidden = true;
      const { error } = await sb.auth.signInWithPassword({ email: emailOf(login), password: f.pw.value });
      if (error) { err.hidden=false; err.textContent = "Usuário ou senha incorretos."; btn.disabled=false; btn.textContent="Entrar"; return; }
      try { await afterAuth(); loginMsg = ""; } catch(e) { me = null; loginMsg = errMsg(e); }
      render();
    })();
    return;
  }
  if (f.id==="setupForm"){
    (async()=>{
      const err = $("#setupErr"), btn = f.querySelector("[type=submit]"), show = t => { err.hidden=false; err.textContent=t; btn.disabled=false; btn.textContent="Criar acesso da fábrica"; };
      const login = f.sLogin.value.trim().toLowerCase(), nome = f.sNome.value.trim();
      if (!/^[a-z0-9._-]{3,30}$/.test(login)) return show("O usuário deve ter de 3 a 30 letras ou números, sem espaços e sem acento.");
      if (f.sPw.value.length < 8) return show("A senha precisa ter pelo menos 8 caracteres.");
      if (f.sPw.value !== f.sPw2.value) return show("As senhas não são iguais.");
      btn.disabled = true; btn.textContent = "Criando…"; err.hidden = true;
      const { data, error } = await sb.auth.signUp({ email: emailOf(login), password: f.sPw.value });
      if (error) return show(errMsg(error));
      if (!data.session) return show("No Supabase, desligue a confirmação de e-mail (Authentication → Sign In / Providers → Email → Confirm email) e tente de novo com outro usuário.");
      const { error:e2 } = await sb.rpc("bootstrap_admin", { p_login: login, p_nome: nome || "Fábrica" });
      if (e2) { await sb.auth.signOut(); return show(errMsg(e2)); }
      boot = "ready"; await afterAuth(); render(); toast("Acesso da fábrica criado");
    })();
    return;
  }
  if (f.id==="pwForm"){
    (async()=>{
      const err = $("#pwErr"), show = t => { err.hidden=false; err.textContent=t; };
      if (f.nPw.value.length < 8) return show("A senha precisa ter pelo menos 8 caracteres.");
      if (f.nPw.value !== f.nPw2.value) return show("As senhas não são iguais.");
      const { error } = await sb.auth.updateUser({ password: f.nPw.value });
      if (error) return show(errMsg(error));
      f.reset(); toast("Senha alterada"); tab = null; render();
    })();
    return;
  }
  if (f.id==="orderForm") return submitOrder();
  if (f.id==="clientForm") return submitClient(f);
  if (f.id==="userForm"){
    (async()=>{
      const err = $("#userErr"), btn = f.querySelector("[type=submit]"), show = t => { err.hidden=false; err.textContent=t; btn.disabled=false; btn.textContent="Criar acesso"; };
      const login = f.login.value.trim().toLowerCase(), nome = f.nome.value.trim(), senha = f.senha.value;
      if (!nome) return show("Informe o nome.");
      if (!/^[a-z0-9._-]{3,30}$/.test(login)) return show("O usuário deve ter de 3 a 30 letras ou números, sem espaços e sem acento.");
      if (senha.length < 8) return show("A senha inicial precisa ter pelo menos 8 caracteres.");
      if (S.users.some(u=>u.login===login)) return show("Esse usuário já existe. Escolha outro.");
      btn.disabled = true; btn.textContent = "Criando…"; err.hidden = true;
      const tmp = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession:false, autoRefreshToken:false, detectSessionInUrl:false, storageKey:"Beg-novo-acesso" } });
      const { data, error } = await tmp.auth.signUp({ email: emailOf(login), password: senha });
      if (error) return show(/registered|already/i.test(errMsg(error)) ? "Esse usuário já existe. Escolha outro." : errMsg(error));
      if (!data.user) return show("Não foi possível criar o acesso.");
      const row = { id:data.user.id, login, nome, role:f.role.value, regiao:f.regiao.value.trim(), ativo:true };
      const { error:e2 } = await sb.from("profiles").insert(row);
      if (e2) return show(errMsg(e2));
      const u = rowToUser(row); S.users.push(u); snap.users[u.id] = JSON.stringify(u);
      render(); toast(`Acesso criado: ${login}`);
    })();
    return;
  }
  if (f.id==="cfgForm"){
    const st = S.settings, num = (n,d) => { const v = parseFloat(f[n]?.value); return isFinite(v) ? v : d; };
    st.repPct = num("repPct",st.repPct); st.repVeComissao = f.repVeComissao?.value==="sim"; st.freteGratisMin = Math.max(0,num("freteGratisMin",st.freteGratisMin)); st.diaPag = Math.min(28,Math.max(1,Math.round(num("diaPag",st.diaPag)))); st.fabricaWhats = digits(f.fabricaWhats?.value||""); st.gestorPct = num("gestorPct",st.gestorPct); st.twoColorAdd = num("twoColorAdd",st.twoColorAdd);
    st.models.forEach(m=>{ m.min = Math.max(1,Math.round(num("min-"+m.id,m.min))); ["P","M","G"].forEach(s=>m.prices[s]=num(`p-${m.id}-${s}`,m.prices[s])); });
    st.tiers.forEach((t,i)=>{ const pct = Math.min(60,Math.max(0,num("tier-"+i,(1-t.f)*100))); t.f = Math.round((1-pct/100)*1000)/1000; });
    save(); render(); toast("Tabela salva. Vale para os próximos pedidos."); return;
  }
});

render();
start();
})();
</script>

</body>
</html>
